<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drift</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font: 12px system-ui, sans-serif; color: rgba(255,255,255,.55);
    background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 999px;
    transition: opacity 1.2s; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click or press F for fullscreen</div>
<script>
(() => {
  // ---- 3D Perlin noise ----
  const perm = new Uint8Array(512);
  (() => {
    const p = Array.from({ length: 256 }, (_, i) => i);
    for (let i = 255; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const grad = (h, x, y, z) => {
    h &= 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  };
  function noise(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
    const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
    return lerp(
      lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
           lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
           lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }

  // ---- Canvas ----
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dpr, particles = [];

  // Palette: warm amber, copper, cream, cool blue-white, dim brown
  const palette = [
    [255, 120, 50], [255, 175, 70], [255, 232, 180], [255, 255, 255],
    [150, 200, 255], [90, 140, 255], [170, 120, 255],
    [255, 110, 160], [255, 150, 90], [200, 150, 120]
  ];
  function colorAt(v) {
    v = Math.min(0.9999, Math.max(0, v)) * (palette.length - 1);
    const i = v | 0, f = v - i;
    const a = palette[i], b = palette[i + 1];
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)];
  }

  function spawn(p) {
    p.x = Math.random() * W;
    p.y = Math.random() * H;
    p.age = 0;
    p.life = 400 + Math.random() * 500;
    p.len = (0.8 + Math.random() * 0.9);
    return p;
  }

  // S = device pixels per "design pixel" (design = 1440x900 CSS px).
  // Streak size, speed and pattern scale with S so every display looks the same.
  let S = 1, SCALE = 0.0016, activeN = 0, maxN = 0, quality = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const cssW = innerWidth, cssH = innerHeight;
    const fit = Math.min(2.2, Math.max(0.7, Math.min(cssW, cssH) / 900));
    S = dpr * fit;
    SCALE = 0.0016 / S;
    W = canvas.width = Math.max(1, Math.floor(cssW * dpr));
    H = canvas.height = Math.max(1, Math.floor(cssH * dpr));
    // Same visual density on any screen, capped for performance
    maxN = Math.min(30000, Math.floor((W * H) / (S * S) / 70));
    particles = Array.from({ length: maxN }, () => {
      const p = spawn({});
      p.age = Math.random() * p.life;
      return p;
    });
    activeN = Math.floor(maxN * quality);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  // Re-run when the window moves to a monitor with a different pixel ratio
  (function watchDpr() {
    const mq = matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
    mq.addEventListener('change', () => { resize(); watchDpr(); }, { once: true });
  })();
  resize();

  let t = 0, last = performance.now();
  // Adaptive quality: learn the display's frame interval, trim particles if it can't keep up
  let emaMs = 16.7, minMs = 1000, lastCheck = performance.now();

  function frame(now) {
    const ms = now - last;
    const dt = Math.min(4, ms / 16.667); // 1.0 == one 60 Hz frame; works at any refresh rate
    last = now;
    if (ms > 0 && ms < 250) {
      emaMs += (ms - emaMs) * 0.05;
      if (now - lastCheck > 1500) {
        minMs = Math.min(minMs * 1.002, emaMs); // refresh interval estimate
        if (emaMs > minMs * 1.45 && quality > 0.3) quality = Math.max(0.3, quality * 0.9);
        else if (emaMs < minMs * 1.12 && quality < 1) quality = Math.min(1, quality * 1.04);
        activeN = Math.floor(maxN * quality);
        lastCheck = now;
      }
    }
    t += 0.0016 * dt;

    ctx.globalCompositeOperation = 'source-over';
    // Trail fade is time-based so it looks identical at 30, 60, 144 or 240 Hz
    ctx.fillStyle = `rgba(0,0,0,${(1 - Math.pow(0.45, dt)).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.6 * S;

    for (let i = 0; i < activeN; i++) {
      const p = particles[i];
      const nx = p.x * SCALE, ny = p.y * SCALE;
      // Flow angle: diagonal sweep with swirling noise
      const ang = -0.75 + noise(nx, ny, t) * 4.2 + noise(nx * 2.3, ny * 2.3, t * 1.7 + 9) * 0.9;
      const dx = Math.cos(ang), dy = Math.sin(ang);

      const speed = (0.35 + 0.65 * (noise(nx * 0.8 + 40, ny * 0.8, t * 0.5) * 0.5 + 0.5)) * 0.9 * S;
      p.x += dx * speed * dt;
      p.y += dy * speed * dt;
      p.age += dt;

      if (p.age > p.life || p.x < -40 * S || p.x > W + 40 * S || p.y < -40 * S || p.y > H + 40 * S) {
        spawn(p);
        continue;
      }

      // Brightness: clustered regions of light vs. darkness
      const region = noise(nx * 0.9 + 100, ny * 0.9 + 100, t * 0.6) * 0.5 + 0.5;
      const bright = Math.pow(Math.max(0, (region - 0.28) / 0.72), 1.6);
      const k = p.age / p.life;
      const env = Math.sin(Math.PI * k);
      const a = bright * env * 0.95;
      if (a < 0.02) continue;

      const hue = noise(nx * 0.7 + 300, ny * 0.7, t * 0.4) * 0.5 + 0.5;
      const c = colorAt((hue - 0.5) * 2.2 + 0.5 + noise(nx * 3 + 500, ny * 3, t) * 0.15);

      const L = (12 + 22 * bright) * p.len * S;
      const tx = p.x - dx * L, ty = p.y - dy * L;
      const g = ctx.createLinearGradient(tx, ty, p.x, p.y);
      g.addColorStop(0, `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},0)`);
      g.addColorStop(1, `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`);
      ctx.strokeStyle = g;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Fullscreen / UI ----
  const hint = document.getElementById('hint');
  const toggleFS = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  };
  canvas.addEventListener('click', toggleFS);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFS(); });
  setTimeout(() => (hint.style.opacity = 0), 5000);
})();
</script>
</body>
</html>
